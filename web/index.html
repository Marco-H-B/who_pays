<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#08090A">
    <title>WHO PAYS?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            background-color: #08090A;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            color: #F4F4F6;
        }
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
            touch-action: none;
        }

        /* Barra Superior debajo de la Isla Dinamica del iPhone 15 */
        #header-container {
            position: absolute;
            top: max(calc(env(safe-area-inset-top) + 16px), 64px);
            left: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
            pointer-events: none;
        }
        #top-bar {
            display: flex;
            background: rgba(26, 27, 32, 0.88);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 4px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            pointer-events: auto;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .mode-btn {
            background: transparent;
            border: none;
            color: #8E8E93;
            padding: 7px 14px;
            font-size: 12px;
            font-weight: 500;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #2C2C2E;
            color: #FFFFFF;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* Boton de Perfil / Login con Google */
        #auth-btn {
            background: rgba(26, 27, 32, 0.88);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 500;
            color: #E5E5EA;
            display: flex;
            align-items: center;
            gap: 6px;
            pointer-events: auto;
            cursor: pointer;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }

        /* Indicacion central en reposo */
        #hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 2;
        }
        #hint h1 {
            font-size: 24px;
            font-weight: 500;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        #hint p {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.25);
        }

        /* Micro-Hoja (Action Sheet) de Registro de Deuda */
        #action-sheet {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(20, 21, 25, 0.96);
            backdrop-filter: blur(35px);
            -webkit-backdrop-filter: blur(35px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 26px 26px 0 0;
            padding: 20px 20px calc(24px + env(safe-area-inset-bottom, 12px)) 20px;
            transform: translateY(105%);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 100;
            touch-action: auto;
        }
        #action-sheet.visible {
            transform: translateY(0%);
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: rgba(255, 255, 255, 0.25);
            border-radius: 2px;
            margin: 0 auto 16px auto;
        }
        .sheet-title {
            font-size: 19px;
            font-weight: 600;
            margin-bottom: 14px;
        }
        .input-group {
            margin-bottom: 14px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #8E8E93;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .input-group input {
            width: 100%;
            background: #0E0F12;
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #FFF;
            padding: 13px 14px;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            -webkit-appearance: none;
        }
        .chips-container {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 12px;
        }
        .chip {
            background: #26282E;
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 13px;
            color: #DDD;
            cursor: pointer;
        }
        .btn-primary {
            width: 100%;
            background: #3A3D45;
            color: #FFF;
            border: none;
            padding: 14px;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 4px;
        }
        .btn-secondary {
            width: 100%;
            background: transparent;
            color: #8E8E93;
            border: none;
            padding: 10px;
            font-size: 13px;
            margin-top: 4px;
            cursor: pointer;
        }

        /* Modal de Mesa QR */
        #qr-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 9, 10, 0.96);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 120;
        }
        #qr-modal.visible {
            display: flex;
        }
        .qr-card {
            background: #141518;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 22px;
            padding: 24px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .qr-img {
            width: 190px;
            height: 190px;
            border-radius: 12px;
            background: #FFF;
            margin: 16px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .qr-room-code {
            font-family: monospace;
            font-size: 24px;
            letter-spacing: 0.15em;
            color: #FFF;
            margin-bottom: 6px;
        }
        .timer-badge {
            display: inline-block;
            font-family: monospace;
            font-size: 18px;
            font-weight: 700;
            padding: 6px 14px;
            border-radius: 12px;
            margin: 10px 0;
            transition: color 0.3s ease, border-color 0.3s ease;
        }

        /* Modal de Autenticacion con Google */
        #auth-modal {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 9, 10, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 24px;
            z-index: 150;
        }
        #auth-modal.visible {
            display: flex;
        }
        .auth-card {
            background: #141518;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 22px;
            padding: 28px 24px;
            text-align: center;
            max-width: 320px;
            width: 100%;
        }
        .btn-google {
            background: #FFFFFF;
            color: #1F1F1F;
            border: none;
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div id="header-container">
        <div id="top-bar">
            <button id="btn-mode-local" class="mode-btn active" onclick="switchMode('local')">1 Celular (2-5)</button>
            <button id="btn-mode-qr" class="mode-btn" onclick="switchMode('qr')">Varios Celulares (QR)</button>
        </div>

        <button id="auth-btn" onclick="openAuthModal()">
            <span id="user-display">Invitado</span>
        </button>
    </div>

    <div id="hint">
        <h1>Pon tu dedo</h1>
        <p>2 a 5 jugadores en pantalla</p>
    </div>

    <canvas id="canvas"></canvas>

    <!-- Micro-Hoja (Action Sheet) -->
    <div id="action-sheet">
        <div class="sheet-handle"></div>
        <div class="sheet-title">¿Quién perdió?</div>

        <div id="chips-section" class="input-group" style="display: none;">
            <label>Amigos Recientes</label>
            <div id="chips-list" class="chips-container"></div>
        </div>

        <div class="input-group">
            <label>Nombre o Apodo del Perdedor</label>
            <input type="text" id="loser-name-input" placeholder="Escribe el nombre aquí..." />
        </div>

        <div class="input-group">
            <label>Monto de la cuenta (Opcional)</label>
            <input type="number" id="bill-amount-input" placeholder="S/ 0.00" />
        </div>

        <button class="btn-primary" onclick="saveDebt()">Guardar en Deudas</button>
        <button class="btn-secondary" onclick="dismissSheet()">Volver a Jugar</button>
    </div>

    <!-- Modal de Mesa QR -->
    <div id="qr-modal">
        <div class="qr-card">
            <div style="font-size: 11px; color: #8E8E93; text-transform: uppercase; letter-spacing: 0.05em;">Modo Varios Celulares</div>
            <div class="qr-room-code">SALA 7F2A</div>
            <p style="font-size: 13px; color: rgba(255,255,255,0.6);">Escanea con la cámara de tu teléfono para unirte</p>
            
            <div class="qr-img">
                <img id="qr-image" src="" alt="Código QR de la Sala" style="width: 100%; height: 100%;" />
            </div>

            <div id="timer-box" class="timer-badge" style="color: #30D158; border: 1px solid #30D158;">
                03:00
            </div>

            <p id="qr-status" style="font-size: 12px; color: #8E8E93; margin-bottom: 12px;">Esperando que se conecten</p>
            <button class="btn-primary" onclick="switchMode('local')">Volver al Modo 1 Celular</button>
        </div>
    </div>

    <!-- Modal de Login con Google -->
    <div id="auth-modal">
        <div class="auth-card">
            <h2 style="font-size: 18px; margin-bottom: 8px;">Tu Perfil Social</h2>
            <p style="font-size: 13px; color: #8E8E93;">Inicia sesión para sincronizar tu Libro de Deudas en cualquier dispositivo.</p>
            
            <button class="btn-google" onclick="simulateGoogleLogin()">
                <svg width="18" height="18" viewBox="0 0 18 18">
                    <path fill="#4285F4" d="M17.64 9.2c0-.63-.06-1.25-.16-1.84H9v3.49h4.84a4.14 4.14 0 0 1-1.8 2.71v2.26h2.92c1.71-1.57 2.68-3.89 2.68-6.62z"/>
                    <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.83.87-3.04.87-2.34 0-4.33-1.58-5.04-3.71H.95v2.33C2.43 15.98 5.48 18 9 18z"/>
                    <path fill="#FBBC05" d="M3.96 10.72A5.41 5.41 0 0 1 3.68 9c0-.6.1-1.18.28-1.72V4.95H.95A9.01 9.01 0 0 0 0 9c0 1.45.35 2.82.95 4.05l3.01-2.33z"/>
                    <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.59C13.46.89 11.43 0 9 0 5.48 0 2.43 2.02.95 4.95l3.01 2.33c.71-2.13 2.7-3.7 5.04-3.7z"/>
                </svg>
                Continuar con Google
            </button>
            <button class="btn-secondary" onclick="closeAuthModal()">Continuar como Invitado</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const hint = document.getElementById('hint');
        const sheet = document.getElementById('action-sheet');
        const qrModal = document.getElementById('qr-modal');
        const authModal = document.getElementById('auth-modal');
        const loserInput = document.getElementById('loser-name-input');
        const amountInput = document.getElementById('bill-amount-input');
        const timerBox = document.getElementById('timer-box');
        const qrImg = document.getElementById('qr-image');
        const chipsSection = document.getElementById('chips-section');
        const chipsList = document.getElementById('chips-list');
        const userDisplay = document.getElementById('user-display');

        let width = window.innerWidth;
        let height = window.innerHeight;

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Estados de maquina
        const STATE = { IDLE: 'IDLE', TENSION: 'TENSION', OUTCOME: 'OUTCOME' };
        let gameState = STATE.IDLE;
        let tensionStart = 0;
        let loserId = null;
        let frozenLoserPos = null;
        let previousFingerCount = 0;

        // Mapa de toques
        const touches = new Map();

        // Motor de audio procedural
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playPop() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(140, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.04);
            gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.04);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.04);
        }

        function playAbortSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(250, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(60, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        function playOutcomeSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(70, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 0.25);
            gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);

            if (navigator.vibrate) {
                navigator.vibrate([250]);
            }
        }

        function playTick(freq) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.05);
        }

        // Filtro estricto: Si el toque ocurre en botones o modales, no generar aros
        function isInteractiveElement(target) {
            return target.closest('#header-container') ||
                   target.closest('#top-bar') ||
                   target.closest('#auth-btn') ||
                   target.closest('#action-sheet') ||
                   target.closest('#qr-modal') ||
                   target.closest('#auth-modal') ||
                   target.tagName === 'BUTTON' ||
                   target.tagName === 'INPUT';
        }

        window.addEventListener('touchstart', (e) => {
            if (isInteractiveElement(e.target)) return;
            e.preventDefault();
            initAudio();

            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                touches.set(t.identifier, { x: t.clientX, y: t.clientY });
            }
            evaluateState();
        }, { passive: false });

        window.addEventListener('touchmove', (e) => {
            if (isInteractiveElement(e.target)) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const t = e.changedTouches[i];
                if (touches.has(t.identifier)) {
                    touches.set(t.identifier, { x: t.clientX, y: t.clientY });
                }
            }
        }, { passive: false });

        window.addEventListener('touchend', (e) => {
            if (isInteractiveElement(e.target)) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                touches.delete(e.changedTouches[i].identifier);
            }
            evaluateState();
        }, { passive: false });

        window.addEventListener('touchcancel', (e) => {
            if (isInteractiveElement(e.target)) return;
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                touches.delete(e.changedTouches[i].identifier);
            }
            evaluateState();
        }, { passive: false });

        function evaluateState() {
            if (gameState === STATE.OUTCOME) return;

            const currentCount = touches.size;
            hint.style.opacity = currentCount === 0 ? '1' : '0';

            if (currentCount >= 2) {
                if (gameState === STATE.IDLE) {
                    gameState = STATE.TENSION;
                    tensionStart = performance.now();
                    playPop();
                } else if (gameState === STATE.TENSION && currentCount !== previousFingerCount) {
                    tensionStart = performance.now();
                    playAbortSound();
                }
            } else {
                if (gameState === STATE.TENSION) {
                    playAbortSound();
                }
                gameState = STATE.IDLE;
            }

            previousFingerCount = currentCount;
        }

        // Bucle continuo a 60 FPS
        function render(now) {
            ctx.clearRect(0, 0, width, height);

            if (gameState === STATE.TENSION) {
                const elapsed = (now - tensionStart) / 1000;
                if (elapsed >= 3.0) {
                    const ids = Array.from(touches.keys());
                    const randomBuffer = new Uint32Array(1);
                    window.crypto.getRandomValues(randomBuffer);
                    const selectedIndex = randomBuffer[0] % ids.length;
                    loserId = ids[selectedIndex];
                    frozenLoserPos = { ...touches.get(loserId) };
                    gameState = STATE.OUTCOME;
                    playOutcomeSound();

                    // Cargar chips reales guardados previamente
                    loadRecentFriendsChips();

                    setTimeout(() => {
                        sheet.classList.add('visible');
                    }, 400);
                }
            }

            if (gameState === STATE.OUTCOME && frozenLoserPos) {
                ctx.save();
                ctx.beginPath();
                ctx.arc(frozenLoserPos.x, frozenLoserPos.y, 68, 0, Math.PI * 2);
                ctx.strokeStyle = '#FFFFFF';
                ctx.lineWidth = 5;
                ctx.shadowColor = '#FFFFFF';
                ctx.shadowBlur = 18;
                ctx.stroke();

                ctx.fillStyle = '#FFFFFF';
                ctx.font = 'bold 18px -apple-system, BlinkMacSystemFont, monospace';
                ctx.textAlign = 'center';
                ctx.shadowBlur = 0;
                ctx.fillText('TÚ PAGAS', frozenLoserPos.x, frozenLoserPos.y - 88);
                ctx.restore();
            } else {
                touches.forEach((pos, id) => {
                    let radius = 45;
                    if (gameState === STATE.TENSION) {
                        const elapsed = (now - tensionStart) / 1000;
                        const progress = Math.min(elapsed / 3.0, 1.0);
                        const freq = 12 + (30 * progress);
                        radius = 45 + Math.sin(elapsed * freq) * (5 * (1 - progress * 0.4));
                    }

                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, radius, 0, Math.PI * 2);
                    ctx.strokeStyle = '#3A3D45';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                });
            }

            requestAnimationFrame(render);
        }
        requestAnimationFrame(render);

        // Amigos reales desde localStorage (cero datos inventados)
        function loadRecentFriendsChips() {
            const savedFriends = JSON.parse(localStorage.getItem('whopays_friends') || '[]');
            chipsList.innerHTML = '';

            if (savedFriends.length > 0) {
                chipsSection.style.display = 'block';
                savedFriends.forEach(friend => {
                    const chip = document.createElement('span');
                    chip.className = 'chip';
                    chip.innerText = friend;
                    chip.onclick = () => selectChip(friend);
                    chipsList.appendChild(chip);
                });
            } else {
                // Primera vez de uso: Oculta la seccion de chips porque no hay ninguno
                chipsSection.style.display = 'none';
            }
        }

        function selectChip(name) {
            loserInput.value = name;
        }

        function saveDebt() {
            const name = loserInput.value.trim() || 'Desconocido';
            const amount = amountInput.value.trim() || '0.00';
            
            // Guardar en amigos recientes
            let savedFriends = JSON.parse(localStorage.getItem('whopays_friends') || '[]');
            if (name !== 'Desconocido' && !savedFriends.includes(name)) {
                savedFriends.push(name);
                localStorage.setItem('whopays_friends', JSON.stringify(savedFriends));
            }

            dismissSheet();
        }

        function dismissSheet() {
            sheet.classList.remove('visible');
            loserInput.value = '';
            amountInput.value = '';
            gameState = STATE.IDLE;
            loserId = null;
            frozenLoserPos = null;
            touches.clear();
            evaluateState();
        }

        // Modos de Juego
        function switchMode(mode) {
            const btnLocal = document.getElementById('btn-mode-local');
            const btnQr = document.getElementById('btn-mode-qr');

            if (mode === 'qr') {
                btnLocal.classList.remove('active');
                btnQr.classList.add('active');
                qrModal.classList.add('visible');

                const roomUrl = window.location.origin + '/?room=7F2A';
                qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(roomUrl);

                startCountdown();
            } else {
                btnLocal.classList.add('active');
                btnQr.classList.remove('active');
                qrModal.classList.remove('visible');
                clearInterval(timerInterval);
            }
        }

        // Temporizador de 3 Minutos para Mesa QR
        let timerSeconds = 180;
        let timerInterval = null;

        function startCountdown() {
            clearInterval(timerInterval);
            timerSeconds = 180;
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timerSeconds--;
                updateTimerDisplay();

                if (timerSeconds <= 10 && timerSeconds > 3) {
                    playTick(800);
                } else if (timerSeconds <= 3 && timerSeconds > 0) {
                    playTick(1200);
                } else if (timerSeconds === 0) {
                    playTick(150);
                    clearInterval(timerInterval);
                    document.getElementById('qr-status').innerText = 'Sesión Expirada (Memoria Liberada)';
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            timerBox.innerText = `${m}:${s}`;

            if (timerSeconds > 90) {
                timerBox.style.color = '#30D158';
                timerBox.style.borderColor = '#30D158';
            } else if (timerSeconds > 30) {
                timerBox.style.color = '#FFD60A';
                timerBox.style.borderColor = '#FFD60A';
            } else {
                timerBox.style.color = '#FF453A';
                timerBox.style.borderColor = '#FF453A';
            }
        }

        // Modales de Auth
        function openAuthModal() {
            authModal.classList.add('visible');
        }

        function closeAuthModal() {
            authModal.classList.remove('visible');
        }

        function simulateGoogleLogin() {
            localStorage.setItem('whopays_user', 'Marco');
            userDisplay.innerText = 'Marco';
            closeAuthModal();
        }

        // Cargar estado inicial de usuario
        const savedUser = localStorage.getItem('whopays_user');
        if (savedUser) {
            userDisplay.innerText = savedUser;
        }
    </script>
</body>
</html>
